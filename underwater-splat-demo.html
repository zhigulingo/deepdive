<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Underwater Canyon · Gaussian Test</title>
<style>*{box-sizing:border-box}html,body,canvas{width:100%;height:100%;margin:0;display:block}body{overflow:hidden;background:#02090d;color:#e9fbff;font-family:Inter,system-ui,sans-serif}canvas{touch-action:none}.hud{position:fixed;z-index:2;left:16px;top:16px;max-width:min(430px,calc(100% - 32px));padding:14px 16px;border:1px solid #ffffff20;border-radius:18px;background:#04131abf;backdrop-filter:blur(16px);pointer-events:none}.hud small{color:#67e7ff;font:800 8px/1.2 ui-monospace,monospace;letter-spacing:.15em}.hud b{display:block;margin-top:6px;font-size:17px}.hud span{display:block;margin-top:6px;color:#d9edf0a6;font-size:11px;line-height:1.4}.bar{height:2px;margin-top:11px;background:#ffffff18;overflow:hidden}.bar i{display:block;width:0;height:100%;background:#67e7ff;box-shadow:0 0 12px #67e7ff;animation:load 4.8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes load{to{width:100%}}.tag{position:fixed;z-index:2;right:14px;bottom:14px;padding:8px 10px;border-radius:999px;background:#04131abf;color:#b9dadd;font:700 8px/1 ui-monospace,monospace;letter-spacing:.1em;pointer-events:none}body.embed .hud,body.embed .tag{display:none}@media(max-width:600px){.hud{left:10px;top:10px}.tag{right:10px;bottom:10px}}</style></head>
<body><div class="hud"><small id="mode">LOADING BLENDER SURFACE</small><b>Underwater Canyon · Splat Test</b><span id="hint">Одна 3D-сцена и одна камера: центры точек раскрываются от центра и превращаются в мягкие Gaussian.</span><div class="bar"><i></i></div></div><div class="tag">DRAG · ORBIT &nbsp; / &nbsp; WHEEL · ZOOM</div><canvas id="c"></canvas>
<script>
const canvas=document.querySelector('#c'),gl=canvas.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance'}),mode=document.querySelector('#mode');
if(!gl){mode.textContent='WEBGL 2 REQUIRED';throw Error('WebGL 2 unavailable')}
const vs=`#version 300 es
precision highp float;layout(location=0)in vec3 aPos;layout(location=1)in vec3 aColor;uniform mat4 uVP;uniform float uTime,uPixel;out vec3 vColor;out float vSoft;
void main(){vec4 clip=uVP*vec4(aPos,1.);gl_Position=clip;float radius=length(aPos.xz);float reveal=smoothstep(radius*.055,radius*.055+1.15,uTime);gl_Position.xy*=reveal;vSoft=smoothstep(2.1,4.2,uTime);gl_PointSize=mix(1.15,clamp(uPixel/clip.w,2.4,11.),vSoft)*reveal;vColor=aColor*mix(1.5,1.,vSoft);}`;
const fs=`#version 300 es
precision highp float;in vec3 vColor;in float vSoft;out vec4 outColor;void main(){vec2 p=gl_PointCoord*2.-1.;float r=dot(p,p);if(r>1.)discard;float a=mix(1.,exp(-3.4*r),vSoft);outColor=vec4(vColor*a,1.);}`;
const shader=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s},program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);gl.useProgram(program);
const m4={perspective:(f,a,n,z)=>{const t=1/Math.tan(f/2),q=1/(n-z);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(z+n)*q,-1,0,0,2*z*n*q,0])},look:(e,t)=>{let zx=e[0]-t[0],zy=e[1]-t[1],zz=e[2]-t[2],l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;let xx=zz,xy=0,xz=-zx;l=Math.hypot(xx,xz);xx/=l;xz/=l;const yx=zy*xz,yy=zz*xx-zx*xz,yz=-zy*xx;return new Float32Array([xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,-xx*e[0]-xz*e[2],-yx*e[0]-yy*e[1]-yz*e[2],-zx*e[0]-zy*e[1]-zz*e[2],1])},mul:(a,b)=>{const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}};
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
let count=0,start=0,yaw=0,pitch=.16,dist=31,drag=false,last=[0,0];
fetch('assets/underwater-canyon.points').then(r=>{if(!r.ok)throw Error(r.status);return r.arrayBuffer()}).then(buf=>{const d=new DataView(buf);count=d.getUint32(4,true);const min=[0,1,2].map(i=>d.getFloat32(8+i*4,true)),max=[0,1,2].map(i=>d.getFloat32(20+i*4,true)),stride=13,pos=new Float32Array(count*3),col=new Uint8Array(count*3);for(let i=0,o=32;i<count;i++,o+=stride){const x=min[0]+d.getUint16(o,true)/65535*(max[0]-min[0]),y=min[1]+d.getUint16(o+2,true)/65535*(max[1]-min[1]),z=min[2]+d.getUint16(o+4,true)/65535*(max[2]-min[2]);pos.set([x,z,-y],i*3);col.set(new Uint8Array(buf,o+9,3),i*3)}const vao=gl.createVertexArray();gl.bindVertexArray(vao);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,pos,gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,col,gl.STATIC_DRAW);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.UNSIGNED_BYTE,true,0,0);start=performance.now();mode.textContent=count.toLocaleString('en-US')+' REAL 3D SURFACE POINTS';requestAnimationFrame(draw)}).catch(e=>{mode.textContent='LOAD ERROR · '+e.message});
function draw(now){const d=Math.min(devicePixelRatio,1.7),w=innerWidth,h=innerHeight;if(canvas.width!==w*d||canvas.height!==h*d){canvas.width=w*d;canvas.height=h*d;gl.viewport(0,0,canvas.width,canvas.height)}gl.clearColor(.005,.025,.038,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);const eye=[Math.sin(yaw)*Math.cos(pitch)*dist,1.4+Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist],vp=m4.mul(m4.perspective(.9,w/h,.1,140),m4.look(eye,[0,-1.2,0]));gl.uniformMatrix4fv(gl.getUniformLocation(program,'uVP'),false,vp);const t=Math.min(6,(now-start)/1000);gl.uniform1f(gl.getUniformLocation(program,'uTime'),t);gl.uniform1f(gl.getUniformLocation(program,'uPixel'),canvas.height*.115);gl.drawArrays(gl.POINTS,0,count);requestAnimationFrame(draw)}
canvas.onpointerdown=e=>{drag=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-last[0])*.006;pitch=Math.max(-.55,Math.min(.72,pitch+(e.clientY-last[1])*.004));last=[e.clientX,e.clientY]};canvas.onpointerup=()=>drag=false;canvas.onwheel=e=>{e.preventDefault();dist=Math.max(18,Math.min(70,dist*Math.exp(e.deltaY*.001)))},{passive:false};
</script></body></html>
